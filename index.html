<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galleon Analyzer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #1e2032; --accent2: #3d4160; --accent-bg: rgba(30,32,50,0.08);
    --teal: #29c9a0; --teal-bg: rgba(41,201,160,0.10);
    --amber: #e8a020; --red: #e85c6a; --green: #5dd68a;
    --radius: 24px; --radius-sm: 10px;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'Noto Sans KR', -apple-system, sans-serif;
  }

  [data-theme="dark"] {
    --bg: #181818; --surface: #202020; --surface2: #282828;
    --border: #2e2e2e; --border2: #3c3c3c;
    --text: #f0eef5; --text2: #9090a8; --text3: #4e4e60;
    --accent: #8b90c8; --accent2: #a8acdc; --accent-bg: rgba(139,144,200,0.12);
    --sql-text: #c8c8e0;
    --cal-filter: invert(0.4);
    --kw: #a8acdc; --fn: #29c9a0; --str: #5dd68a; --cm: #4e4e60; --num: #e8a020;
  }

  [data-theme="light"] {
    --bg: #f4f4f4; --surface: #ffffff; --surface2: #f0f0f0;
    --border: #e4e4e4; --border2: #d0d0d0;
    --text: #1a1a2e; --text2: #505070; --text3: #a0a0b0;
    --accent: #1e2032; --accent2: #3d4160; --accent-bg: rgba(30,32,50,0.07);
    --sql-text: #1e2032;
    --cal-filter: invert(0);
    --kw: #1e2032; --fn: #117a5c; --str: #2a7a3a; --cm: #a0a0b0; --num: #b06010;
    --teal-bg: rgba(17,122,92,0.08);
  }

  html { transition: background 0.25s, color 0.25s; }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; transition: background 0.25s, color 0.25s; }
  .app { max-width: 1280px; min-width: 360px; margin: 0 auto; padding: 40px 24px 80px; }

  .header { margin-bottom: 36px; display: flex; align-items: center; justify-content: space-between; }
  .header-left {}
  .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--accent2); background: var(--accent-bg); border: 1px solid rgba(30,32,50,0.25); padding: 4px 10px; border-radius: 20px; margin-bottom: 14px; letter-spacing: 0.05em; }
  .badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { font-size: 14px; color: var(--text2); }

  .theme-toggle { display: flex; align-items: center; gap: 8px; padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border2); background: var(--surface); cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle-icon { font-size: 14px; line-height: 1; }
  .theme-toggle-label { font-size: 11px; font-family: var(--mono); color: var(--text2); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; transition: background 0.25s, border-color 0.25s; }
  .panel-title { font-size: 14px; font-weight: 900; color: var(--text2); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  .qtabs { display: flex; flex-wrap: nowrap; gap: 8px; margin-bottom: 16px; }
  .qbtn { flex: 1; padding: 7px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; font-family: var(--sans); text-align: center; white-space: nowrap; }
  @media (max-width: 520px) { .qtabs { grid-template-columns: repeat(3, 1fr); } }
  .qbtn:hover { border-color: var(--border2); color: var(--text); }
  .qbtn.active { border-color: #8058F7; background: #ECE5FF; color: #3d2080; }

  .param-field { transition: opacity 0.2s, transform 0.2s; }
  .param-field.hidden { display: none; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .fgrid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  .fg { display: flex; flex-direction: column; gap: 5px; }
  .fg.full { grid-column: 1 / -1; }
  label { font-size: 11px; color: var(--text2); font-weight: 400; letter-spacing: 0.03em; }
  input[type="text"], input[type="date"], select {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 11px; font-size: 13px; color: var(--text); font-family: var(--sans);
    transition: border-color 0.15s, background 0.25s; width: 100%; outline: none; -webkit-appearance: none;
  }
  input[type="text"]:focus, input[type="date"]:focus, select:focus { border-color: #8058F7; }
  input::placeholder { color: var(--text3); font-family: var(--mono); font-size: 12px; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: var(--cal-filter); cursor: pointer; }
  select option { background: var(--surface2); }

  .cal-inline { background: transparent; border-radius: var(--radius-sm); padding: 0; }

  .cal-header { display: flex; align-items: center; justify-content: center; margin-bottom: 16px; gap: 8px; }
  .cal-selects { display: flex; gap: 6px; align-items: center; }
  .cal-hint { font-size: 12px; color: var(--text3); font-family: 'Inter', var(--sans); }
  .cal-hint.selected { color: #8058F7; font-weight: 500; font-family: 'Inter', var(--sans); }
  .cal-selects select {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--text);
    font-family: var(--sans); cursor: pointer; outline: none; -webkit-appearance: none;
    transition: border-color 0.15s; width: auto;
  }
  .cal-nav {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text2); cursor: pointer; transition: all 0.15s; flex-shrink: 0;
  }
  .cal-nav:hover { border-color: #8058F7; color: #8058F7; background: #ECE5FF; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; min-height: 200px; }
  .cal-dow {
    text-align: center; font-size: 11px; font-weight: 500; color: var(--text3);
    padding: 0 0 10px; font-family: var(--mono); letter-spacing: 0.04em;
  }
  .cal-day {
    text-align: center; padding: 9px 0; font-size: 13px; font-family: var(--mono);
    color: var(--text2); cursor: pointer; transition: background 0.1s, color 0.1s;
    border-radius: 0; line-height: 1;
  }
  .cal-day:hover:not(.empty):not(.start):not(.end) { background: var(--surface2); color: var(--text); border-radius: var(--radius-sm); }
  .cal-day.empty { cursor: default; }
  .cal-day.today { color: #8058F7; font-weight: 700; background: #ECE5FF; border-radius: var(--radius-sm); }
  [data-theme="dark"] .cal-day.today { background: rgba(128,88,247,0.15); color: #c4aaff; }
  .cal-day.in-range { background: #ECE5FF; color: #5030b0; border-radius: 0; }
  .cal-day.hover-range { background: #ECE5FF; color: #5030b0; border-radius: 0; }
  .cal-day.start { background: #8058F7; color: #fff; font-weight: 700; border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .cal-day.end   { background: #8058F7; color: #fff; font-weight: 700; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .cal-day.start-end { border-radius: var(--radius-sm); }
  .cal-day.start:not(.range-start-cap) { border-radius: var(--radius-sm); }
  .cal-day.end:not(.range-end-cap)     { border-radius: var(--radius-sm); }

  [data-theme="dark"] .cal-day.in-range,
  [data-theme="dark"] .cal-day.hover-range { background: rgba(128,88,247,0.15); color: #c4aaff; }
  [data-theme="dark"] .cal-nav:hover { background: rgba(128,88,247,0.15); border-color: #8058F7; color: #c4aaff; }

  .cal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .cal-hint { font-size: 12px; color: var(--text3); font-family: var(--mono); }
  .cal-hint.selected { color: #8058F7; font-weight: 500; }
  .cal-clear { font-size: 11px; font-family: var(--mono); color: var(--text3); background: none; border: none; cursor: pointer; padding: 0; transition: color 0.15s; }
  .cal-clear:hover { color: var(--red); }

  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-8px); background: var(--text); color: var(--bg); font-size: 13px; font-weight: 500; font-family: var(--sans); padding: 10px 20px; border-radius: 999px; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 9999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .chatdic-btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--text2); font-family: var(--sans); text-decoration: none; transition: all 0.15s; cursor: pointer; }
  .chatdic-btn:hover { border-color: #8058F7; color: #8058F7; background: #ECE5FF; }
  [data-theme="dark"] .chatdic-btn:hover { background: rgba(128,88,247,0.15); }

  .gen-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); transition: opacity 0.15s; letter-spacing: -0.01em; }
  .gen-btn:hover { opacity: 0.85; }
  .gen-btn:active { opacity: 0.7; }

  .sql-box { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; font-family: var(--mono); font-size: 12px; line-height: 1.85; color: var(--sql-text); white-space: pre; overflow-x: auto; position: relative; transition: background 0.25s; }
  .kw { color: var(--kw); font-weight: 500; }
  .fn { color: var(--fn); }
  .str { color: var(--str); }
  .cm { color: var(--cm); font-style: italic; }
  .num { color: var(--num); }

  .copy-btn-full { width: 100%; margin-top: 12px; padding: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text2); font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--sans); transition: all 0.15s; letter-spacing: -0.01em; }
  .copy-btn-full:hover { border-color: var(--border2); color: var(--text); }
  .copy-btn-full.ok { border-color: var(--teal); color: var(--teal); }

  .hint { margin-top: 10px; font-size: 12px; color: var(--text3); font-family: var(--mono); }

  .upload-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 32px 20px; text-align: center; cursor: pointer; transition: all 0.15s; background: var(--surface2); }
  .upload-zone:hover, .upload-zone.over { border-color: var(--accent); background: var(--accent-bg); }
  .up-icon { width: 38px; height: 38px; margin: 0 auto 10px; background: var(--surface); border: 1px solid var(--border2); border-radius: 9px; display: flex; align-items: center; justify-content: center; }
  .upload-zone p { font-size: 13px; color: var(--text2); margin-bottom: 3px; }
  .upload-zone span { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  #fileInput { display: none; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .mc { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
  .mc-lbl { font-size: 10px; color: var(--text3); font-family: var(--mono); margin-bottom: 6px; letter-spacing: 0.05em; }
  .mc-val { font-size: 21px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
  .mc-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .col-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: flex-end; }
  .col-row .fg { flex: 1; min-width: 120px; }

  .ctype-row { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .export-btn { margin-left: auto !important; }
  .ctbtn { padding: 5px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text2); font-size: 12px; cursor: pointer; transition: all 0.15s; font-family: var(--sans); }
  .ctbtn:hover { color: var(--text); }
  .ctbtn.active { background: #ECE5FF; border-color: #8058F7; color: #3d2080; }

  .chart-wrap { position: relative; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; overflow-x: hidden; overflow-y: visible; }

  .insight { background: var(--teal-bg); border: 1px solid rgba(41,201,160,0.22); border-radius: var(--radius-sm); padding: 11px 14px; font-size: 12px; color: var(--teal); margin-top: 14px; display: none; }
  .insight.show { display: block; }

  .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--mono); }
  th { background: var(--surface); color: var(--text2); font-weight: 500; padding: 9px 13px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 13px; border-bottom: 1px solid var(--border); color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  @media (min-width: 681px) {
    .fgrid { grid-template-columns: 1fr 1fr; align-items: start; }
    #field-funnel-hint, #field-funnel-steps { grid-column: 1 / -1; }
  }

  @media (max-width: 580px) {
    .metrics { grid-template-columns: 1fr 1fr; }
    .fgrid { grid-template-columns: 1fr; }
    .header { flex-direction: column; gap: 12px; }
  }

  @media (max-width: 420px) {
    .acc-head { padding: 20px; }
    .acc-body { padding: 0 20px 20px; }
    .app { padding: 24px 12px 60px; }
    .cal-selects select { font-size: 12px; padding: 5px 8px; }
  }

  .accordion { border: none; border-radius: var(--radius); margin-bottom: 12px; background: var(--surface); overflow: hidden; transition: box-shadow 0.2s, background 0.25s; box-shadow: 0 4px 20px rgba(0,0,0,0.10); }
  .accordion.open { box-shadow: 0 4px 20px rgba(0,0,0,0.10); }
  .accordion.open .acc-arrow { transform: rotate(180deg); }

  .acc-head { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 32px; background: none; border: none; cursor: pointer; gap: 12px; text-align: left; }
  .acc-head:hover { background: var(--surface2); }
  .acc-head-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }

  .acc-arrow { width: 16px; height: 16px; color: var(--text3); flex-shrink: 0; transition: transform 0.25s ease; }

  .acc-body { padding: 0 32px 32px; }
  .acc-body.collapsed { display: none; }

  .section-num { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); border: 1px solid rgba(30,32,50,0.25); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--accent2); flex-shrink: 0; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; line-height: 1.3; }
  .section-desc { font-size: 11px; color: var(--text3); margin-top: 2px; }
</style>
</head>
<body>
<div class="toast" id="toast">쿼리가 복사되었습니다</div>
<div class="app">

  <div class="header">
    <div class="header-left">
      <h1>Data Driver</h1>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">
      <span class="theme-toggle-icon" id="themeIcon">☀</span>
      <span class="theme-toggle-label" id="themeLabel">라이트</span>
    </button>
  </div>

  <div class="accordion open" id="acc1">
    <button class="acc-head" onclick="toggleAcc('acc1')">
      <div class="acc-head-left">
        <div class="section-num">1</div>
        <div>
          <div class="section-title">SQL 생성</div>
          <div class="section-desc">분석 유형과 파라미터를 입력해 쿼리를 만들어요</div>
        </div>
      </div>
      <svg class="acc-arrow" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="acc-body" id="acc1-body">
      <a href="https://chatdic.skplanet.com" target="_blank" class="chatdic-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex-shrink:0"><path d="M8 1.5C4.41 1.5 1.5 4.08 1.5 7.25c0 1.6.7 3.04 1.84 4.08L2.5 14l2.9-1.1A7.1 7.1 0 008 13c3.59 0 6.5-2.58 6.5-5.75S11.59 1.5 8 1.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Chat.DIC 열기
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" style="flex-shrink:0;opacity:0.5"><path d="M3.5 2H10v6.5M10 2L2 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </a>
      <div class="panel-title" style="margin-top:20px">분석 유형 선택</div>
      <div class="qtabs">
        <button class="qbtn active" onclick="setQ('click',this)">클릭 분석</button>
        <button class="qbtn" onclick="setQ('funnel',this)">퍼널 분석</button>
        <button class="qbtn" onclick="setQ('entry',this)">진입 경로</button>
        <button class="qbtn" onclick="setQ('retention',this)">재방문율</button>
        <button class="qbtn" onclick="setQ('purchase',this)">구매 분석</button>
      </div>
      <div class="panel-title" style="margin-top:32px">파라미터</div>
      <div class="fgrid">
        <div class="fg">
          <label>테이블</label>
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="font-family:var(--mono);font-size:12px;color:var(--text2);padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);flex:1;" id="tbl-display">OCB.OCB_D_INTG_LOG</div>
            <button onclick="onTblCustomToggle()" id="tbl-edit-btn" style="flex-shrink:0;padding:8px 12px;font-size:12px;font-family:var(--sans);font-weight:500;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all 0.15s;">직접 입력</button>
          </div>
          <input type="hidden" id="tbl" value="OCB.OCB_D_INTG_LOG">
          <input type="text" id="tbl-custom" placeholder="DB명.테이블명" style="display:none;margin-top:8px;" oninput="document.getElementById('tbl').value=this.value||'OCB.OCB_D_INTG_LOG';document.getElementById('tbl-display').textContent=this.value||'OCB.OCB_D_INTG_LOG';">
        </div>
        <div class="fg" id="field-pid">
          <label>페이지 ID / page_id (콤마로 복수 입력 가능)</label>
          <input type="text" id="pid" placeholder="/pointcon/brandall, /pointcon/main">
        </div>
        <div class="fg" id="field-funnel-hint" style="display:none; grid-column: 1 / -1">
          <label>퍼널 유형 선택</label>
          <select id="funnel-type" onchange="onFunnelTypeChange()">
            <option value="ecoupon">e쿠폰 구매 퍼널 — 메인 → 브랜드 → 상세 → 주문서 → 완료</option>
            <option value="groupbuy">공동구매 퍼널 — 쇼핑탭 → 공동구매 → 상세 → 주문서 → 완료</option>
            <option value="recommend">추천 퍼널 — 추천 → 상세 → 주문서 → 완료</option>
          </select>
        </div>
        <div class="fg" id="field-funnel-steps" style="display:none; grid-column: 1 / -1">
          <div id="funnel-steps-preview" style="display:flex;flex-direction:column;gap:4px;padding:0;"></div>
        </div>
        <div class="fg param-field" id="field-aid">
          <label>액션 ID / actn_id (선택 — 입력 시 해당 액션만 필터)</label>
          <div id="aid-list" style="display:flex;flex-direction:column;gap:6px;"></div>

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const isDark = theme === 'dark';
  document.getElementById('themeIcon').textContent = isDark ? '☀' : '☾';
  document.getElementById('themeLabel').textContent = isDark ? '라이트' : '다크';
  localStorage.setItem('ga-theme', theme);
  if (chartInst) renderChart();
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

(function initTheme() {
  const saved = localStorage.getItem('ga-theme');
  if (saved) { applyTheme(saved); return; }
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
    if (!localStorage.getItem('ga-theme')) applyTheme(e.matches ? 'dark' : 'light');
  });
})();

    acc.classList.remove('open');
  } else {
    body.classList.remove('collapsed');
    acc.classList.add('open');
  }
}

function openAcc(id) {

  acc.classList.add('open');
}

let calFrom = null, calTo = null, calHover = null;
let calYear, calMonth;
let picking = false;

(function initCal() {
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
})();

function initCalSelects() {
  const ySel = document.getElementById('calYearSel');
  const now = new Date().getFullYear();
  for (let y = now - 5; y <= now + 1; y++) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + '년';
    if (y === calYear) o.selected = true;
    ySel.appendChild(o);
  }
  document.getElementById('calMonthSel').value = calMonth;
}

function onYearMonthChange() {
  calYear  = parseInt(document.getElementById('calYearSel').value);
  calMonth = parseInt(document.getElementById('calMonthSel').value);
  renderCal();
}

function shiftMonth(d, e) {
  e && e.stopPropagation();
  calMonth += d;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  document.getElementById('calYearSel').value  = calYear;
  document.getElementById('calMonthSel').value = calMonth;
  renderCal();
}

function renderCal() {
  const DAYS = ['일','월','화','수','목','금','토'];
  const grid = document.getElementById('calGrid');
  const first = new Date(calYear, calMonth, 1).getDay();
  const total = new Date(calYear, calMonth + 1, 0).getDate();

  let html = DAYS.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < first; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= total; d++) {
    const ds = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isStart = calFrom === ds;
    const isEnd   = calTo   === ds;
    const rangeEnd = calTo || calHover;
    const lo = calFrom && rangeEnd ? (calFrom < rangeEnd ? calFrom : rangeEnd) : null;
    const hi = calFrom && rangeEnd ? (calFrom < rangeEnd ? rangeEnd : calFrom) : null;
    const inRange = lo && hi && ds > lo && ds < hi;

    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    let cls = 'cal-day';
    if (ds === todayStr && !isStart && !isEnd) cls += ' today';
    if (isStart && isEnd)   cls += ' start end start-end';
    else if (isStart)       cls += ' start' + (rangeEnd && rangeEnd !== ds ? ' range-start-cap' : '');
    else if (isEnd)         cls += ' end range-end-cap';
    else if (calFrom && calHover && !calTo && ds === calHover) cls += ' end range-end-cap';
    else if (inRange)       cls += ' in-range';

    html += `<div class="${cls}" data-d="${ds}">${d}</div>`;
  }

  grid.innerHTML = html;

  grid.onclick = ev => {
    const el = ev.target.closest('.cal-day:not(.empty)');
    if (el) { ev.stopPropagation(); pickDay(el.dataset.d); }
  };
  grid.onmouseover = ev => {
    const el = ev.target.closest('.cal-day:not(.empty)');
    if (el) hoverDay(el.dataset.d);
  };

  updateRangeInput();
}

function hoverDay(ds) {
  if (!calFrom || calTo) return;
  calHover = ds;
  document.querySelectorAll('#calGrid .cal-day').forEach(el => {
    const d = el.dataset.d;
    if (!d) return;
    const lo = calFrom < ds ? calFrom : ds;
    const hi = calFrom < ds ? ds : calFrom;
    el.classList.remove('in-range', 'hover-range', 'end', 'range-end-cap', 'range-start-cap');
    if (d === calFrom) {
      el.classList.add('start');
      if (ds !== calFrom) el.classList.add('range-start-cap');
    } else if (d === ds && d !== calFrom) {
      el.classList.add('end', 'range-end-cap');
    } else if (d > lo && d < hi) {
      el.classList.add('in-range');
    }
  });
}

function pickDay(ds) {
  if (!calFrom || calTo) {
    calFrom = ds; calTo = null; calHover = null;
    renderCal();
  } else {
    if (ds === calFrom) return;
    if (ds < calFrom) { calTo = calFrom; calFrom = ds; }
    else { calTo = ds; }
    calHover = null;
    renderCal();
    updateRangeInput();
  }
}

function clearDates(e) {
  e && e.stopPropagation();
  calFrom = null; calTo = null; calHover = null;
  updateRangeInput(); renderCal();
}

function fmt(s) {
  if (!s) return '';
  const [y,m,d] = s.split('-');
  return `${y}.${m}.${d}`;
}

function updateRangeInput() {
  const hint = document.getElementById('calHint');
  if (calFrom && calTo) {
    hint.textContent = `${fmt(calFrom)} ~ ${fmt(calTo)}`;
    hint.className = 'cal-hint selected';
  } else if (calFrom) {
    hint.textContent = '종료일을 선택하세요';
    hint.className = 'cal-hint';
  } else {
    hint.textContent = '시작일을 선택하세요';
    hint.className = 'cal-hint';
  }
}

function addAidRow(value) {
  const list = document.getElementById('aid-list');
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:6px;align-items:center;';
  row.innerHTML = `
    <input type="text" class="aid-input" placeholder="brand_tap.brand" value="${value||''}" style="flex:1;">
    <button type="button" onclick="removeAidRow(this)" style="flex-shrink:0;width:30px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text3);cursor:pointer;transition:all 0.15s;font-size:15px;line-height:1;" onmouseover="this.style.borderColor='var(--red)';this.style.color='var(--red)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text3)'">×</button>
  `;

function removeAidRow(btn) {
  const list = document.getElementById('aid-list');
  if (list.children.length <= 1) return;
  btn.closest('div').remove();
  updateAidRemoveButtons();
}

function updateAidRemoveButtons() {
  const list = document.getElementById('aid-list');
  const btns = list.querySelectorAll('button');
  btns.forEach(b => b.style.visibility = list.children.length <= 1 ? 'hidden' : 'visible');
}

function genSQL(){
  const tblSel = document.getElementById('tbl').value;
  const T = tblSel || 'OCB.OCB_D_INTG_LOG';
  const cfg = TABLE_CONFIG[tblSel] || { dateCol: 'dt', partition: false, hasPageId: true, dateType: 'str8' };
  const DC = cfg.dateCol;
  const isPartition = cfg.partition || false;
  const hasPageId = cfg.hasPageId !== false;
  const raw = document.getElementById('pid').value.trim() || '/pointcon/brandall';
  const aidInputs = [...document.querySelectorAll('.aid-input')].map(i=>i.value.trim()).filter(Boolean);
  const A = aidInputs[0] || '';
  const XF = document.getElementById('xf').value.trim();
  const DF = calFrom ? calFrom.replace(/-/g,'') : 'YYYYMMDD';
  const DT = calTo   ? calTo.replace(/-/g,'')   : 'YYYYMMDD';
  const xf = XF ? `\n        <span class="kw">AND</span> ${XF}` : '';

  const pages = raw.split(',').map(s => s.trim()).filter(Boolean);
  const pageFilter = hasPageId
    ? (pages.length > 1
        ? `<span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) <span class="kw">IN</span> (${pages.map(p=>`<span class="str">'${p.toLowerCase()}'</span>`).join(', ')})`
        : `<span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) = <span class="str">'${pages[0].toLowerCase()}'</span>`)
    : '';
  const P = pages[0];

  const dateType = cfg.dateType || 'str8';
  const dateFilter = isPartition
    ? `${DC} = <span class="str">'${DF}'</span>`
    : dateType === 'date'
    ? `<span class="fn">TO_CHAR</span>(${DC}, <span class="str">'YYYYMMDD'</span>) >= <span class="str">'${DF}'</span>
        <span class="kw">AND</span> <span class="fn">TO_CHAR</span>(${DC}, <span class="str">'YYYYMMDD'</span>) <= <span class="str">'${DT}'</span>`
    : dateType === 'str8'
    ? `${DC} >= <span class="str">'${DF}'</span>
        <span class="kw">AND</span> ${DC} <= <span class="str">'${DT}'</span>`
    : `<span class="fn">CONCAT</span>(<span class="fn">SUBSTR</span>(${DC},<span class="num">1</span>,<span class="num">4</span>),<span class="fn">SUBSTR</span>(${DC},<span class="num">6</span>,<span class="num">2</span>),<span class="fn">SUBSTR</span>(${DC},<span class="num">9</span>,<span class="num">2</span>)) >= <span class="str">'${DF}'</span>
        <span class="kw">AND</span> <span class="fn">CONCAT</span>(<span class="fn">SUBSTR</span>(${DC},<span class="num">1</span>,<span class="num">4</span>),<span class="fn">SUBSTR</span>(${DC},<span class="num">6</span>,<span class="num">2</span>),<span class="fn">SUBSTR</span>(${DC},<span class="num">9</span>,<span class="num">2</span>)) <= <span class="str">'${DT}'</span>`;

  // WHERE 조건 조합: pageFilter 있으면 앞에, 없으면 dateFilter만
  const whereBase = pageFilter
    ? `${pageFilter}\n        <span class="kw">AND</span> ${dateFilter}`
    : dateFilter;

  // 집계 단위
  const unit = document.getElementById('unit')?.value || 'day';
  const unitCol = unit === 'month'
    ? `<span class="fn">SUBSTR</span>(${DC},<span class="num">1</span>,<span class="num">6</span>)`
    : unit === 'week'
    ? `<span class="kw">CASE</span> <span class="kw">WHEN</span> <span class="fn">DAYOFWEEK</span>(${DC}) = <span class="num">1</span> <span class="kw">THEN</span> <span class="fn">DATE_SUB</span>(${DC}, <span class="num">6</span>) <span class="kw">ELSE</span> <span class="fn">DATE_SUB</span>(${DC}, <span class="fn">DAYOFWEEK</span>(${DC}) - <span class="num">2</span>) <span class="kw">END</span>`
    : `<span class="fn">SUBSTR</span>(${DC},<span class="num">1</span>,<span class="num">8</span>)`;
  const unitLabel = unit === 'month' ? 'dt_month' : unit === 'week' ? 'dt_week' : 'dt_day';

  let sql = '';

  if(qtype==='click'){
    const aidFilter = aidInputs.length === 1
      ? `\n        <span class="kw">AND</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(actn_id)) = <span class="str">'${aidInputs[0].toLowerCase()}'</span>`
      : aidInputs.length > 1
      ? `\n        <span class="kw">AND</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(actn_id)) <span class="kw">IN</span> (${aidInputs.map(a=>`<span class="str">'${a.toLowerCase()}'</span>`).join(', ')})`
      : '';
    sql=`<span class="cm">-- click analysis: click distribution by action (by ${unit})</span>
<span class="kw">SELECT</span>
    ${unitLabel},
    actn_id,
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id) <span class="kw">AS</span> unique_users,
    <span class="fn">COUNT</span>(*) <span class="kw">AS</span> total_clicks,
    <span class="fn">ROUND</span>(<span class="fn">COUNT</span>(*)*<span class="num">1.0</span>/<span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id),<span class="num">2</span>) <span class="kw">AS</span> clicks_per_user
<span class="kw">FROM</span> (
    <span class="kw">SELECT</span> mbr_id, actn_id,
        ${unitCol} <span class="kw">AS</span> ${unitLabel}
    <span class="kw">FROM</span> ${T}
    <span class="kw">WHERE</span> ${whereBase}${aidFilter}${xf}
) t
<span class="kw">GROUP BY</span> ${unitLabel}, actn_id
<span class="kw">ORDER BY</span> ${unitLabel}, unique_users <span class="kw">DESC</span>
<span class="kw">LIMIT</span> <span class="num">100</span>`;
  } else if(qtype==='funnel'){
    const ftype = document.getElementById('funnel-type')?.value || 'ecoupon';
    const fcfg = FUNNEL_CONFIG[ftype] || FUNNEL_CONFIG.ecoupon;
    const steps = fcfg.steps;
    const getPages = s => s.pages || [s.page];
    const hasActn = steps.some(s => s.actn);
    const stepsNoActn = steps.filter(s => !s.actn);
    const stepsHaveActn = steps.filter(s => s.actn);
    const allPagesNoActn = [...new Set(stepsNoActn.flatMap(getPages))];
    const pageListParts = allPagesNoActn.map(p=>`<span class="str">'${p}'</span>`).join(', ');
    const actnParts = stepsHaveActn.map(s=>
      `(<span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) = <span class="str">'${s.page}'</span> <span class="kw">AND</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(actn_id)) = <span class="str">'${s.actn}'</span>)`
    ).join(`\n        <span class="kw">OR</span> `);
    const whereSteps = allPagesNoActn.length && stepsHaveActn.length
      ? `<span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) <span class="kw">IN</span> (${pageListParts})\n        <span class="kw">OR</span> ${actnParts}`
      : allPagesNoActn.length
        ? `<span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) <span class="kw">IN</span> (${pageListParts})`
        : actnParts;
    const caseOrder = steps.map(s => {
      const pg = getPages(s);
      if (s.actn) return `            <span class="kw">WHEN</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) = <span class="str">'${s.page}'</span> <span class="kw">AND</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(actn_id)) = <span class="str">'${s.actn}'</span> <span class="kw">THEN</span> <span class="num">${s.order}</span>`;
      if (pg.length > 1) return `            <span class="kw">WHEN</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) <span class="kw">IN</span> (${pg.map(p=>`<span class="str">'${p}'</span>`).join(', ')}) <span class="kw">THEN</span> <span class="num">${s.order}</span>`;
      return `            <span class="kw">WHEN</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) = <span class="str">'${pg[0]}'</span> <span class="kw">THEN</span> <span class="num">${s.order}</span>`;
    }).join('\n');
    const caseName = steps.map(s => {
      const pg = getPages(s);
      if (s.actn) return `            <span class="kw">WHEN</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) = <span class="str">'${s.page}'</span> <span class="kw">AND</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(actn_id)) = <span class="str">'${s.actn}'</span> <span class="kw">THEN</span> <span class="str">'${s.name}'</span>`;
      if (pg.length > 1) return `            <span class="kw">WHEN</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) <span class="kw">IN</span> (${pg.map(p=>`<span class="str">'${p}'</span>`).join(', ')}) <span class="kw">THEN</span> <span class="str">'${s.name}'</span>`;
      return `            <span class="kw">WHEN</span> <span class="fn">LOWER</span>(<span class="fn">TRIM</span>(page_id)) = <span class="str">'${pg[0]}'</span> <span class="kw">THEN</span> <span class="str">'${s.name}'</span>`;
    }).join('\n');

    sql=`<span class="cm">-- funnel analysis: ${fcfg.label} (by ${unit})</span>
<span class="kw">SELECT</span>
    ${unitLabel},
    step_order,
    step_name,
    page_id,
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id) <span class="kw">AS</span> users,
    <span class="fn">ROUND</span>(
        <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id) * <span class="num">100.0</span> /
        <span class="fn">FIRST_VALUE</span>(<span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id)) <span class="kw">OVER</span>(<span class="kw">PARTITION BY</span> ${unitLabel} <span class="kw">ORDER BY</span> step_order), <span class="num">1</span>
    ) <span class="kw">AS</span> conversion_rate,
    <span class="fn">ROUND</span>(
        (<span class="num">1</span> - <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id) * <span class="num">1.0</span> /
        <span class="fn">LAG</span>(<span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id)) <span class="kw">OVER</span>(<span class="kw">PARTITION BY</span> ${unitLabel} <span class="kw">ORDER BY</span> step_order)) * <span class="num">100</span>, <span class="num">1</span>
    ) <span class="kw">AS</span> drop_rate
<span class="kw">FROM</span> (
    <span class="kw">SELECT</span> mbr_id, page_id,${hasActn ? ` actn_id,` : ``}
        ${unitCol} <span class="kw">AS</span> ${unitLabel},
        <span class="kw">CASE</span>
${caseOrder}
        <span class="kw">END</span> <span class="kw">AS</span> step_order,
        <span class="kw">CASE</span>
${caseName}
        <span class="kw">END</span> <span class="kw">AS</span> step_name
    <span class="kw">FROM</span> ${T}
    <span class="kw">WHERE</span> (${whereSteps})
        <span class="kw">AND</span> ${dateFilter}${xf}
) t
<span class="kw">WHERE</span> step_order <span class="kw">IS NOT NULL</span>
<span class="kw">GROUP BY</span> ${unitLabel}, step_order, step_name, page_id
<span class="kw">ORDER BY</span> ${unitLabel}, step_order
<span class="kw">LIMIT</span> <span class="num">100</span>`;
  } else if(qtype==='entry'){
    sql=`<span class="cm">-- entry path analysis: bounce rate by referrer page (by ${unit})</span>
<span class="kw">SELECT</span>
    ${unitLabel},
    <span class="fn">COALESCE</span>(referrer_page,<span class="str">'(direct)'</span>) <span class="kw">AS</span> referrer_page,
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> mbr_id) <span class="kw">AS</span> visitors,
    <span class="fn">SUM</span>(<span class="kw">CASE WHEN</span> next_action <span class="kw">IS NULL THEN</span> <span class="num">1</span> <span class="kw">ELSE</span> <span class="num">0</span> <span class="kw">END</span>) <span class="kw">AS</span> bounced,
    <span class="fn">ROUND</span>(
        <span class="fn">SUM</span>(<span class="kw">CASE WHEN</span> next_action <span class="kw">IS NULL THEN</span> <span class="num">1</span> <span class="kw">ELSE</span> <span class="num">0</span> <span class="kw">END</span>)*<span class="num">100.0</span>
        /<span class="fn">COUNT</span>(*),<span class="num">1</span>
    ) <span class="kw">AS</span> bounce_rate
<span class="kw">FROM</span> (
    <span class="kw">SELECT</span> mbr_id, page_id,
        ${unitCol} <span class="kw">AS</span> ${unitLabel},
        <span class="fn">LAG</span>(page_id) <span class="kw">OVER</span>(<span class="kw">PARTITION BY</span> mbr_id <span class="kw">ORDER BY</span> ${DC}) <span class="kw">AS</span> referrer_page,
        <span class="fn">LEAD</span>(trade_type) <span class="kw">OVER</span>(<span class="kw">PARTITION BY</span> mbr_id <span class="kw">ORDER BY</span> ${DC}) <span class="kw">AS</span> next_action
    <span class="kw">FROM</span> ${T}
    <span class="kw">WHERE</span> ${pageFilter}
        <span class="kw">AND</span> ${dateFilter}${xf}
) t
<span class="kw">GROUP BY</span> ${unitLabel}, referrer_page
<span class="kw">ORDER BY</span> ${unitLabel}, visitors <span class="kw">DESC</span>
<span class="kw">LIMIT</span> <span class="num">100</span>`;
  } else if(qtype==='retention'){
    sql=`<span class="cm">-- retention analysis: new vs returning users (by ${unit})</span>
<span class="kw">SELECT</span>
    first_visit_${unitLabel},
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> a.mbr_id) <span class="kw">AS</span> new_users,
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> b.mbr_id) <span class="kw">AS</span> returning_users,
    <span class="fn">ROUND</span>(
        <span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> b.mbr_id)*<span class="num">100.0</span>
        /<span class="fn">COUNT</span>(<span class="kw">DISTINCT</span> a.mbr_id), <span class="num">1</span>
    ) <span class="kw">AS</span> retention_rate
<span class="kw">FROM</span> (
    <span class="kw">SELECT</span> mbr_id,
        <span class="fn">MIN</span>(${unitCol}) <span class="kw">AS</span> first_visit_${unitLabel}
    <span class="kw">FROM</span> ${T}
    <span class="kw">WHERE</span> ${pageFilter}
        <span class="kw">AND</span> ${dateFilter}
    <span class="kw">GROUP BY</span> mbr_id
) a
<span class="kw">LEFT JOIN</span> ${T} b
    <span class="kw">ON</span> a.mbr_id = b.mbr_id
    <span class="kw">AND</span> ${pageFilter.replace(/\n\s*/g,' ')}
    <span class="kw">AND</span> ${unitCol} > a.first_visit_${unitLabel}
    <span class="kw">AND</span> ${dateFilter}
<span class="kw">GROUP BY</span> first_visit_${unitLabel}
<span class="kw">ORDER BY</span> first_visit_${unitLabel}
<span class="kw">LIMIT</span> <span class="num">100</span>`;
  } else if(qtype==='purchase'){
    sql=`<span class="cm">-- purchase analysis: buy/cancel aggregation by ${unit}</span>
<span class="kw">SELECT</span>
    ${unitLabel},
    <span class="fn">COUNT</span>(<span class="kw">CASE WHEN</span> trade_type = <span class="str">'BUY'</span> <span class="kw">THEN</span> trade_type <span class="kw">END</span>) <span class="kw">AS</span> buy_cnt,
    <span class="fn">COUNT</span>(<span class="kw">CASE WHEN</span> trade_type = <span class="str">'CANCEL'</span> <span class="kw">THEN</span> trade_type <span class="kw">END</span>) <span class="kw">AS</span> cancel_cnt,
    <span class="fn">SUM</span>(<span class="kw">CASE WHEN</span> trade_type = <span class="str">'BUY'</span> <span class="kw">THEN</span> price <span class="kw">END</span>) <span class="kw">AS</span> buy_sum,
    <span class="fn">SUM</span>(<span class="kw">CASE WHEN</span> trade_type = <span class="str">'CANCEL'</span> <span class="kw">THEN</span> price <span class="kw">END</span>) <span class="kw">AS</span> cancel_sum,
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT CASE WHEN</span> trade_type = <span class="str">'BUY'</span> <span class="kw">THEN</span> mbr_id <span class="kw">END</span>) <span class="kw">AS</span> buy_lv,
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT CASE WHEN</span> trade_type = <span class="str">'CANCEL'</span> <span class="kw">THEN</span> mbr_id <span class="kw">END</span>) <span class="kw">AS</span> cancel_lv,
    <span class="fn">COUNT</span>(<span class="kw">DISTINCT CASE WHEN</span> trade_type = <span class="str">'BUY'</span> <span class="kw">THEN</span> mbr_id <span class="kw">END</span>) - <span class="fn">COUNT</span>(<span class="kw">DISTINCT CASE WHEN</span> trade_type = <span class="str">'CANCEL'</span> <span class="kw">THEN</span> mbr_id <span class="kw">END</span>) <span class="kw">AS</span> actual_lv,
    <span class="fn">SUM</span>(<span class="kw">CASE WHEN</span> trade_type = <span class="str">'BUY'</span> <span class="kw">THEN</span> price <span class="kw">END</span>) - <span class="fn">SUM</span>(<span class="kw">CASE WHEN</span> trade_type = <span class="str">'CANCEL'</span> <span class="kw">THEN</span> price <span class="kw">END</span>) <span class="kw">AS</span> actual_sum
<span class="kw">FROM</span> (
    <span class="kw">SELECT</span> trade_type, price, mbr_id,
        ${unitCol} <span class="kw">AS</span> ${unitLabel}
    <span class="kw">FROM</span> ${T}
    <span class="kw">WHERE</span> ${dateFilter}
        <span class="kw">AND</span> status = <span class="str">'00'</span>${xf}
) t
<span class="kw">GROUP BY</span> ${unitLabel}
<span class="kw">ORDER BY</span> ${unitLabel}
<span class="kw">LIMIT</span> <span class="num">100</span>`;
  }

  document.getElementById('sqlCode').innerHTML=sql;
  openAcc('acc2');

  setTimeout(()=>{
    const acc = document.getElementById('acc2');
    acc.scrollIntoView({ behavior: 'smooth', block: 'start' });
    acc.style.transition = 'border-color 0.3s ease';
    acc.style.borderColor = 'rgba(30,32,50,0.7)';
    setTimeout(()=>{ acc.style.borderColor = ''; }, 1600);
  }, 80);
}

function exportChart() {
  if (!chartInst) return;
  const canvas = document.getElementById('chart');
  const now = new Date();
  const ts = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}`;
  const filename = `data_driver_chart_${ts}.png`;

  // Blob 방식 — Mac/Windows 모두 호환
  canvas.toBlob(blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
    showToast('다운로드 폴더에 저장되었습니다');
  }, 'image/png');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  if (msg) t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => { t.classList.remove('show'); t.textContent = '쿼리가 복사되었습니다'; }, 2000);
}

function copySQL(){
  const raw = document.getElementById('sqlCode').innerHTML;
  const clean = raw
    .replace(/<[^>]+>/g, '')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"');
  navigator.clipboard.writeText(clean).then(()=>{
    showToast();
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = clean;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast();
  });
}

const dz=document.getElementById('dropZone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0]);});
function handleFile(e){if(e.target.files[0])processFile(e.target.files[0]);}

function processFile(f){
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='csv'){
    Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{
      rows=r.data.map(row=>{
        const o={};
        Object.keys(row).forEach(k=>{ o[k] = (row[k]==='NULL'||row[k]===''||row[k]==null) ? null : row[k]; });
        return o;
      });
      cols=r.meta.fields;
      renderAll();
    }});
  } else {
    const r=new FileReader();
    r.onload=e=>{
      const wb=XLSX.read(e.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:null});
      cols=raw[0].map(String);
      rows=raw.slice(1).map(row=>{
        const o={};
        cols.forEach((h,i)=>{
          const v=row[i];
          o[h]=(v==='NULL'||v===''||v==null)?null:v;
        });
        return o;
      });
      renderAll();
    };
    r.readAsArrayBuffer(f);
  }
}

function renderAll(){
  openAcc('acc4');
  renderMetrics(); renderColSelects(); renderTable(); renderInsight();
  // canvas가 DOM에 렌더된 후 차트 그리기
  setTimeout(()=>{
    renderChart();
    document.getElementById('acc4').scrollIntoView({ behavior:'smooth', block:'start' });
  }, 100);
}

function renderMetrics(){
  const numCols=cols.filter(h=>rows.some(r=>!isNaN(parseFloat(r[h]))));
  let html=`<div class="mc"><div class="mc-lbl">TOTAL ROWS</div><div class="mc-val">${rows.length.toLocaleString()}</div><div class="mc-sub">데이터 행 수</div></div>`;
  html+=`<div class="mc"><div class="mc-lbl">COLUMNS</div><div class="mc-val">${cols.length}</div><div class="mc-sub">컬럼 수</div></div>`;
  numCols.slice(0,2).forEach(c=>{
    const v=rows.map(r=>parseFloat(r[c])).filter(x=>!isNaN(x));
    const avg=v.reduce((a,b)=>a+b,0)/v.length;
    html+=`<div class="mc"><div class="mc-lbl">${c.toUpperCase().slice(0,10)}</div><div class="mc-val">${avg>=1000?Math.round(avg).toLocaleString():avg.toFixed(1)}</div><div class="mc-sub">평균</div></div>`;
  });
  while(html.split('class="mc"').length-1<4) html+=`<div class="mc"><div class="mc-lbl">—</div><div class="mc-val" style="color:var(--text3)">—</div></div>`;
  document.getElementById('metrics').innerHTML=html;
}

function renderColSelects(){
  const opts=cols.map(h=>`<option value="${h}">${h}</option>`).join('');
  document.getElementById('colRow').innerHTML=
    `<div class="fg"><label>X축 (레이블)</label><select id="xc" onchange="renderChart();renderInsight()">${opts}</select></div>
     <div class="fg"><label>Y축 (수치)</label><select id="yc" onchange="renderChart();renderInsight()">${opts}</select></div>`;
  // X축: 숫자가 아닌 값이 있는 컬럼 (한글 포함 문자열 우선)
  const sc = cols.find(h => rows.some(r => r[h]!==null && isNaN(Number(r[h]))));
  // Y축: 숫자 컬럼 중 날짜(8자리), 순서형(1~10 이내 소수값), X축 제외
  const nc = cols.find(h => {
    if(h === sc) return false;
    const nonNull = rows.filter(r=>r[h]!==null);
    if(!nonNull.length) return false;
    if(!nonNull.every(r=>!isNaN(Number(r[h])))) return false;
    if(nonNull.every(r=>String(r[h]).length>=7)) return false; // 날짜형 제외
    const vals = nonNull.map(r=>Number(r[h]));
    const max = Math.max(...vals);
    if(max <= 10) return false; // step_order 같은 순서 제외
    return true;
  });
  if(sc) document.getElementById('xc').value = sc;
  else document.getElementById('xc').value = cols[0];
  if(nc && nc !== sc) document.getElementById('yc').value = nc;
  else document.getElementById('yc').value = cols[cols.length-1];
}

function setCT(t,el){
  ct=t; document.querySelectorAll('.ctbtn').forEach(b=>b.classList.remove('active')); el.classList.add('active'); renderChart();
}

function renderChart(){
  const xc=document.getElementById('xc')?.value;
  const yc=document.getElementById('yc')?.value;
  if(!xc||!yc||!rows.length) return;

  if(chartInst){ chartInst.destroy(); chartInst=null; }
  const wrap = document.querySelector('.chart-wrap');
  wrap.innerHTML = '<div id="chart-scroll" style="overflow-x:auto;overflow-y:visible;"><canvas id="chart"></canvas></div>';
  const canvas = document.getElementById('chart');

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const tickColor = isDark ? '#9488a8' : '#8070a0';
  const gridColor = isDark ? '#2e2e2e' : '#e2dded';
  const pal=['#8058F7','#29c9a0','#e8a020','#e85c6a','#5dd68a','#8b90c8','#38d9b4','#f0c040','#fb7c4a','#60c8f8'];

  const isPie=ct==='pie', isH=ct==='hbar', isLine=ct==='line';
  const chartType = isPie?'pie':isLine?'line':'bar';

  // X축 고유값, 그룹 컬럼 감지 (X축 외 문자열 컬럼)
  const strCols = cols.filter(h => h!==xc && rows.some(r=>r[h]!=null&&isNaN(Number(r[h]))));
  const groupCol = strCols[0] || null;

  let labels, datasets;

  if(groupCol && !isPie){
    // 멀티 데이터셋: X=날짜, group=step_name 등
    const xVals = [...new Set(rows.map(r=>r[xc]!=null?String(r[xc]):''))];
    const gVals = [...new Set(rows.map(r=>r[groupCol]!=null?String(r[groupCol]):''))];
    labels = xVals;
    datasets = gVals.map((g,gi)=>({
      label: g,
      data: xVals.map(x=>{
        const found = rows.find(r=>String(r[xc])===x && String(r[groupCol])===g);
        return found && found[yc]!=null && !isNaN(Number(found[yc])) ? Number(found[yc]) : 0;
      }),
      backgroundColor: pal[gi%pal.length]+'aa',
      borderColor: pal[gi%pal.length],
      borderWidth:1, borderRadius:3, tension:0.35
    }));
  } else {
    // 단일 데이터셋: 집계
    const aggMap = new Map();
    rows.forEach(r=>{
      const lbl = r[xc]!=null?String(r[xc]).slice(0,22):'';
      const val = r[yc]!=null&&!isNaN(Number(r[yc]))?Number(r[yc]):0;
      aggMap.set(lbl,(aggMap.get(lbl)||0)+val);
    });
    labels = [...aggMap.keys()];
    datasets = [{
      label: yc,
      data: [...aggMap.values()],
      backgroundColor: labels.map((_,i)=>pal[i%pal.length]+'aa'),
      borderColor: labels.map((_,i)=>pal[i%pal.length]),
      borderWidth:1, borderRadius:4, tension:0.35,
      fill: isLine?{target:'origin',above:'rgba(128,88,247,0.08)'}:false
    }];
  }

  // 캔버스 크기: 가로 스크롤 + 세로 자동 확장
  const minBarW = 40;
  const barCount = labels.length * (datasets.length||1);
  const wrapW = wrap.clientWidth - 36;
  const canvasW = Math.max(wrapW, barCount * minBarW + 80);
  // 세로: 가로막대면 데이터 수에 따라 확장, 아니면 360 고정
  const canvasH = isH ? Math.max(360, labels.length * (datasets.length||1) * 22 + 60) : 360;
  canvas.width = canvasW;
  canvas.height = canvasH;
  canvas.style.display = 'block';
  wrap.style.height = canvasH + 36 + 'px';

  chartInst = new Chart(canvas.getContext('2d'),{
    type: chartType,
    data:{ labels, datasets },
    options:{
      indexAxis: isH?'y':'x',
      responsive: false,
      maintainAspectRatio: false,
      plugins:{
        legend:{ display: datasets.length>1||isPie, labels:{color:tickColor,font:{size:11},boxWidth:10} },
        tooltip:{ padding:10 }
      },
      scales: isPie?{}:{
        x:{ grid:{color:gridColor}, ticks:{color:tickColor,font:{size:11},maxRotation:45} },
        y:{ grid:{color:gridColor}, ticks:{color:tickColor,font:{size:11}} }
      }
    }
  });
}

function renderTable(){
  const head=`<thead><tr>${cols.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`;
  const body=rows.slice(0,50).map(r=>`<tr>${cols.map(h=>`<td>${r[h]??''}</td>`).join('')}</tr>`).join('');
  document.getElementById('tbl2').innerHTML=head+`<tbody>${body}</tbody>`;
}

function renderInsight(){
  const yc=document.getElementById('yc')?.value;
  const xc=document.getElementById('xc')?.value;
  if(!yc) return;
  const vals=rows.map(r=>parseFloat(r[yc])).filter(v=>!isNaN(v));
  if(!vals.length) return;
  const max=Math.max(...vals), min=Math.min(...vals);
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  const mx=rows.find(r=>parseFloat(r[yc])===max);
  const lbl=mx&&xc?mx[xc]:'';
  const ins=document.getElementById('insight');
  ins.innerHTML=`최댓값: <strong style="color:var(--teal)">${lbl}</strong> (${max.toLocaleString()}) &nbsp;·&nbsp; 평균: ${avg.toFixed(1)} &nbsp;·&nbsp; 최솟값: ${min.toLocaleString()}`;
  ins.classList.add('show');
}

(()=>{
  const t=ct;
  document.getElementById('chart')&&new Chart(document.getElementById('chart').getContext('2d'),{type:'bar',data:{labels:[],datasets:[]}});
})();
</script>
</body>
</html>
